<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG Classifier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Pokémon TCG Classifier</h1>
      <div class="search-bar">
        <input type="text" id="search-box" placeholder="Search for a card..." />
        <button id="search-button" class="button">Search</button>
      </div>
      <div id="filters-container">
        <div class="search-bar">
          <input type="text" id="type-filter" placeholder="Card Type (e.g., Fire, Water)" />
          <input type="text" id="rarity-filter" placeholder="Rarity (e.g., Rare, Common)" />
          <input type="number" id="min-hp-filter" placeholder="Min HP" />
          <input type="number" id="max-hp-filter" placeholder="Max HP" />
          <button class="button" id="filter-button">Filter</button>
        </div>
        <div class="search-bar">
          <input type="text" id="reverse-search-box" placeholder="Enter Classification Code (e.g., S.Pokemon.25.Fire)" />
          <button class="button" id="reverse-search-button">Reverse Search</button>
        </div>
      </div>
      
      
    </header>
    <main>
        <div id="carousel-container" class="card-carousel">

        <!-- Cards will be rendered here -->
      </div>
      <div id="card-details-container">
        <!-- Card details will be shown here -->
      </div>
       <!-- Add power level and classification display -->
       <div id="card-classification">
                <h3>Card Classification</h3>
                <div class="power-level" id="power-level"></div>
                <div class="classification-code" id="classification-code"></div>
                <div class="code-explanation" id="code-explanation"></div>
            </div>
        </main>
        </div>
        <script>
            const POKEMONTCG_API_KEY = "your-api-key";
            const POKEMONTCG_API_BASE = "https://api.pokemontcg.io/v2";
            const POKEAPI_BASE = "https://pokeapi.co/api/v2";
        </script>
        <script type="module" src="js/api.js"></script>
        <script type="module" src="js/cardUtils.js"></script>
        <script type="module" src="js/ui.js"></script>
        <script type="module" src="js/app.js"></script>

  <script>
    // Global Variables
    let recentlyViewedCards = []; // Stores recently viewed cards
    let pokemonList = []; // Stores the basic Pokémon list for the dropdown

    // Initialize App
    async function initializeApp() {
      console.log("Initializing App...");

      // Load recently viewed cards from local storage
      loadRecentlyViewedCards();

      // Fetch Pokémon list for reverse search dropdown
      await fetchPokemonList();

      // Set up event listeners
      setupEventListeners();
    }

    // Load Recently Viewed Cards
    function loadRecentlyViewedCards() {
      if (localStorage.getItem("recentlyViewed")) {
        recentlyViewedCards = JSON.parse(localStorage.getItem("recentlyViewed"));
        renderRecentlyViewedCards();
      }
    }

    // Fetch Pokémon List
    async function fetchPokemonList() {
      try {
        const response = await fetch(`${POKEAPI_BASE}/pokemon?limit=1000`);
        const data = await response.json();
        pokemonList = data.results.map((pokemon) => pokemon.name);
        console.log("Pokémon list loaded:", pokemonList);
      } catch (error) {
        console.error("Error fetching Pokémon list:", error);
      }
    }

    // Render Recently Viewed Cards
    function renderRecentlyViewedCards() {
      const carouselContainer = document.getElementById("carousel-container");
      carouselContainer.innerHTML = "";

      if (recentlyViewedCards.length === 0) {
        carouselContainer.innerHTML = "<p>No recently viewed cards. Search to get started!</p>";
        return;
      }

      recentlyViewedCards.forEach((card) => {
        const cardElement = document.createElement("div");
        cardElement.classList.add("card");
        cardElement.innerHTML = `
          <img src="${card.images.small}" alt="${card.name}" />
          <p>${card.name}</p>
        `;
        cardElement.addEventListener("click", () => displayCardDetails(card));
        carouselContainer.appendChild(cardElement);
      });
    }

    // Display Card Details
    function displayCardDetails(card) {
      const cardDetailsContainer = document.getElementById("card-details-container");
      cardDetailsContainer.innerHTML = `
        <h2>${card.name}</h2>
        <img src="${card.images.large}" alt="${card.name}" />
        <p>HP: ${card.hp}</p>
        <p>Type: ${card.types.join(", ")}</p>
      `;
      addToRecentlyViewed(card);
    }

    // Add Card to Recently Viewed
    function addToRecentlyViewed(card) {
      recentlyViewedCards = [card, ...recentlyViewedCards.filter((c) => c.id !== card.id)];
      if (recentlyViewedCards.length > 10) recentlyViewedCards.pop(); // Limit to 10
      localStorage.setItem("recentlyViewed", JSON.stringify(recentlyViewedCards));
      renderRecentlyViewedCards();
    }

    function setupEventListeners() {
        const searchBox = document.getElementById("search-box");
        const searchButton = document.getElementById("search-button");
        const filterButton = document.getElementById("filter-button");
        const reverseSearchButton = document.getElementById("reverse-search-button");

        searchButton.addEventListener("click", () => searchCardsByName(searchBox.value));
        searchBox.addEventListener("keypress", (event) => {
            if (event.key === "Enter") searchCardsByName(searchBox.value);
        });

        filterButton.addEventListener("click", () => {
            const filters = {
            type: document.getElementById("type-filter").value,
            rarity: document.getElementById("rarity-filter").value,
            minHP: document.getElementById("min-hp-filter").value,
            maxHP: document.getElementById("max-hp-filter").value
            };
            searchCardsByFilters(filters);
        });

        reverseSearchButton.addEventListener("click", () => {
            const classificationCode = document.getElementById("reverse-search-box").value;
            reverseSearch(classificationCode);
        });
        }


    // Search Cards by Name
    async function searchCardsByName(name) {
      if (!name.trim()) {
        alert("Please enter a card name to search.");
        return;
      }

      try {
        const response = await fetch(`${POKEMONTCG_API_BASE}/cards?q=name:${name}`, {
          headers: { "X-Api-Key": POKEMONTCG_API_KEY },
        });
        const data = await response.json();
        renderSearchResults(data.data);
      } catch (error) {
        console.error("Error searching cards:", error);
      }
    }

    // Render Search Results
    function renderSearchResults(cards) {
      const carouselContainer = document.getElementById("carousel-container");
      carouselContainer.innerHTML = "";

      if (cards.length === 0) {
        carouselContainer.innerHTML = "<p>No cards found. Try another search!</p>";
        return;
      }

      cards.forEach((card) => {
        const cardElement = document.createElement("div");
        cardElement.classList.add("card");
        cardElement.innerHTML = `
          <img src="${card.images.small}" alt="${card.name}" />
          <p>${card.name}</p>
        `;
        cardElement.addEventListener("click", () => displayCardDetails(card));
        carouselContainer.appendChild(cardElement);
      });
    }

    // Start the App
    initializeApp();

  </script>
</body>
</html>
