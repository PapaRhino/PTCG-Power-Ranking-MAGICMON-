<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card-container { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .card { cursor: pointer; text-align: center; border: 1px solid #ccc; padding: 10px; border-radius: 5px; width: 450px; }
        .card img { max-width: 400px; max-height: 400px; }
        .classification { font-weight: bold; color: #555; margin-top: 10px; }
        #searchControls { margin-bottom: 20px; }
        #searchInput { padding: 8px; font-size: 16px; }
        #searchBtn { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Pokémon Card Classifier</h1>
    <div id="searchControls">
        <input type="text" id="searchInput" placeholder="Enter card name..." />
        <button id="searchBtn">Search</button>
    </div>

    <div class="card-container" id="cardContainer"></div>

    <script>
        const POKEMONTCG_API_KEY = "your-api-key";
        const POKEMONTCG_API_BASE = "https://api.pokemontcg.io/v2";
        const POKEAPI_BASE = "https://pokeapi.co/api/v2";

        async function searchCards(query) {
            const tcgResponse = await fetch(`${POKEMONTCG_API_BASE}/cards?q=name:${query}`, {
                headers: { "X-Api-Key": POKEMONTCG_API_KEY }
            });
            const tcgData = await tcgResponse.json();
            return tcgData.data;
        }

        

        

        async function renderCards(cards) {
            const container = document.getElementById("cardContainer");
            container.innerHTML = ""; // Clear previous results

            for (const card of cards) {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card";

                // Await the Pokedex number here
                const pokedexNumber = await getPokedexNumber(card.name);
                const powerTier = evaluateCard(card).tier;
                const powerLevel = evaluateCard(card).score;
                const cardType = determineCardType(card);
                const classificationCode = `${powerTier}.${powerLevel}.${cardType}.${pokedexNumber || "9999"}`;
                
                cardDiv.innerHTML = `
                    <img src="${card.images.small}" alt="${card.name}" />
                    <p>${card.name}</p>
                    <div class="classification" id="classification-${card.id}">Code: ${classificationCode}</div>
                `;
                
                container.appendChild(cardDiv);
            }
        }


        async function getPokedexNumber(pokemonName) {
            const cleanName = cleanPokemonName(pokemonName);
            const response = await fetch(`${POKEAPI_BASE}/pokemon/${cleanName}`);
            if (!response.ok) return null;
            const data = await response.json();
            return data.id;
        }

        function cleanPokemonName(name) {
            // Remove common prefixes
            name = name.replace(/^(Lance's|Radiant|Dark|Shining|Rocket's|Team Magma's|Team Aqua's|Team Rocket's|Misty's|Brock's|Giovanni's|Galarian|Paldean|Alolan|Team Plasma's)\s+/i, '');
            // Remove common suffixes
            name = name.replace(/\s(EX|GX|VMAX|VSTAR|Tag Team|Lv\.X|BREAK|Prime|FB|G|GL|4|V-UNION|V)$/i, '');
            // Normalize spaces and capitalization
            return name.trim().toLowerCase();
        }

        document.getElementById("searchBtn").onclick = async () => {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;

            const cards = await searchCards(query);
            if (cards.length === 0) {
                alert("No cards found!");
                return;
            }

            renderCards(cards);
        };

        function checkForEffects(text) {
    const effects = {
        score: 0,
        details: []
    };

    if (!text) return effects;

    text = text.toLowerCase();

    // Check for deck search effects
    if (text.includes("search your deck") && 
        text.includes("pokémon") && 
        text.includes("bench") && 
        !text.includes("energy")) {
        effects.score += 8;
        effects.details.push("Call for Family (+8)");
    }
    else if (text.includes("search your deck")) {
        effects.score += 4;
        effects.details.push("Deck Search (+4)");
    }

    // Check for status conditions
    if (text.includes("burned")) {
        effects.score += 2;
        effects.details.push("Burned Status (+2)");
    }
    if (text.includes("paralyzed")) {
        effects.score += 2;
        effects.details.push("Paralyzed Status (+2)");
    }
    if (text.includes("poisoned")) {
        effects.score += 3;
        effects.details.push("Poisoned Status (+3)");
    }
    if (text.includes("asleep") || text.includes("confused")) {
        effects.score += 4;
        effects.details.push("Asleep/Confused Status (+4)");
    }

    // Check for drawbacks
    if (text.includes("damage to itself")) {
        effects.score -= 2;
        effects.details.push("Self Damage (-2)");
    }

    return effects;
}

// Main evaluation function
function evaluateCard(card) {
    if (!card || card.supertype !== "Pokémon") {
        return { score: 0, details: ["Not a Pokémon card"], tier: "N/A" };
    }

    let score = 0;
    let details = [];

    // Calculate HP score
    const hp = parseInt(card.hp) || 0;
    let hpScore = 0;
    if (hp >= 200) hpScore = 4;
    else if (hp >= 120) hpScore = 3;
    else if (hp >= 60) hpScore = 2;
    else hpScore = -3;

    score += hpScore;
    details.push(`HP (${hp}): ${hpScore >= 0 ? '+' : ''}${hpScore}`);

    // Calculate summon cost
    const retreatCost = card.retreatCost ? card.retreatCost.length : 0;
    const stage = card.subtypes && card.subtypes.includes("Stage 2") ? 2 :
                 card.subtypes && card.subtypes.includes("Stage 1") ? 1 : 0;
    const ruleBox = card.subtypes && card.subtypes.some(st => 
        ['V', 'VMAX', 'VSTAR', 'GX', 'EX', 'MEGA'].includes(st)) ? 1 : 0;

    const summonCost = Math.max(1, retreatCost + stage + ruleBox);
    const summonScore = summonCost === 1 ? 3 : 
                       summonCost === 2 ? 2 : 
                       summonCost === 3 ? 1 : 
                       summonCost === 4 ? 0 : -2;
    
    score += summonScore;
    details.push(`Summon Cost (${summonCost}): ${summonScore >= 0 ? '+' : ''}${summonScore}`);

    // Calculate attack scores
    if (card.attacks) {
        card.attacks.forEach(attack => {
            let attackScore = 0;
            let attackDetails = [];

            // Check for effects
            const effectResults = checkForEffects(attack.text);
            attackScore += effectResults.score;
            attackDetails = [...effectResults.details];

            // Check damage
            const damageStr = attack.damage || '';
            if (damageStr && !damageStr.includes('+') && !damageStr.includes('×')) {
                const damage = parseInt(damageStr);
                if (damage >= 100) {
                    attackScore += 3;
                    attackDetails.push("High Damage (+3)");
                } else if (damage >= 50) {
                    attackScore += 2;
                    attackDetails.push("Medium Damage (+2)");
                }
            }

            score += attackScore;
            if (attackDetails.length > 0) {
                details.push(`Attack "${attack.name}": ${attackDetails.join(", ")}`);
            }
        });
    }

    // Calculate abilities score
    if (card.abilities) {
        card.abilities.forEach(ability => {
            const effectResults = checkForEffects(ability.text);
            score += effectResults.score;
            if (effectResults.details.length > 0) {
                details.push(`Ability "${ability.name}": ${effectResults.details.join(", ")}`);
            }
        });
    }

    // Determine tier based on final score
    let tier = "D";
    if (score >= 10) tier = "S";
    else if (score >= 8) tier = "A";
    else if (score >= 5) tier = "B";
    else if (score >= 3) tier = "C";

    return {
        score,
        tier,
        details
    };
}

        //function to determine card type
function determineCardType(card) {
    if (!card) return null;

    if (card.supertype === "Pokémon") {
        if (card.subtypes && card.subtypes.some(st => 
            ['V', 'VMAX', 'VSTAR'].some(v => st.includes(v)))) return "110";
        if (card.subtypes && card.subtypes.includes("MEGA")) return "120";
        if (card.subtypes && card.subtypes.includes("GX")) return "130";
        if (card.subtypes && card.subtypes.includes("EX")) return "140";
        if (card.subtypes && card.subtypes.includes("LV.X")) return "150";
        if (card.subtypes && card.subtypes.includes("BREAK")) return "160";
        if (card.subtypes && card.subtypes.includes("Prime")) return "170";
        if (card.subtypes && card.subtypes.includes("Stage 2")) return "230";
        if (card.subtypes && card.subtypes.includes("Stage 1")) return "220";
        return "210"; // Basic Pokémon
    }

    if (card.supertype === "Trainer") {
        if (card.subtypes && card.subtypes.includes("Item")) return "310";
        if (card.subtypes && card.subtypes.includes("Tool")) return "320";
        if (card.subtypes && card.subtypes.includes("Supporter")) return "330";
        if (card.subtypes && card.subtypes.includes("Stadium")) return "340";
        return "350"; // Old typeless  trainer cards
    }

    if (card.supertype === "Energy") {
        return card.subtypes && card.subtypes.includes("Basic") ? "410" : "420";
    }

    return null;
}

    </script>
</body>
</html>
