<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card-container { display: flex; flex-wrap: wrap; gap: 30px; margin-top: 20px; justify-content: center; }
        .card { 
            text-align: center; 
            border: 2px solid #ccc; 
            padding: 20px; 
            border-radius: 10px; 
            width: 300px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { 
            transform: scale(1.05); 
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2); 
        }
        .card img { 
            max-width: 200px; 
            max-height: 200px; 
        }
        .classification { 
            font-weight: bold; 
            color: #333; 
            margin-top: 15px; 
        }
        #searchControls { margin-bottom: 20px; text-align: center; }
        #searchInput { 
            padding: 10px; 
            font-size: 18px; 
            width: 60%; 
            max-width: 400px; 
            border: 2px solid #ccc; 
            border-radius: 5px;
        }
        #searchBtn { 
            padding: 10px 20px; 
            font-size: 18px; 
            cursor: pointer; 
            border: none; 
            background-color: #007bff; 
            color: white; 
            border-radius: 5px;
            margin-left: 10px;
            transition: background-color 0.3s ease;
        }
        #searchBtn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Pokémon Card Classifier</h1>
    <div id="searchControls">
        <input type="text" id="searchInput" placeholder="Enter card name..." />
        <button id="searchBtn">Search</button>
    </div>

    <div class="card-container" id="cardContainer"></div>

    <script>
        const POKEMONTCG_API_KEY = "your-api-key";
        const POKEMONTCG_API_BASE = "https://api.pokemontcg.io/v2";
        const POKEAPI_BASE = "https://pokeapi.co/api/v2";

        async function searchCards(query) {
            const tcgResponse = await fetch(`${POKEMONTCG_API_BASE}/cards?q=name:${query}`, {
                headers: { "X-Api-Key": POKEMONTCG_API_KEY }
            });
            const tcgData = await tcgResponse.json();
            return tcgData.data;
        }

        async function renderCards(cards) {
            const container = document.getElementById("cardContainer");
            container.innerHTML = ""; // Clear previous results

            for (const card of cards) {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card";

                // Await the Pokedex number here
                const pokedexNumber = await getPokedexNumber(card.name);
                const powerTier = evaluateCard(card).tier;
                const powerLevel = evaluateCard(card).score;
                const cardType = determineCardType(card);
                const classificationCode = `${powerTier}.${powerLevel}.${cardType}.${pokedexNumber || "9999"}`;
                
                cardDiv.innerHTML = `
                    <img src="${card.images.large}" alt="${card.name}" />
                    <p style="font-size: 20px; margin-top: 10px;">${card.name}</p>
                    <div class="classification" id="classification-${card.id}">Code: ${classificationCode}</div>
                `;
                
                container.appendChild(cardDiv);
            }
        }

        async function getPokedexNumber(pokemonName) {
            const cleanName = cleanPokemonName(pokemonName);
            const response = await fetch(`${POKEAPI_BASE}/pokemon/${cleanName}`);
            if (!response.ok) return null;
            const data = await response.json();
            return data.id;
        }

        function cleanPokemonName(name) {
            // Remove common prefixes
            name = name.replace(/^(Lance's|Radiant|Dark|Shining|Rocket's|Team Magma's|Team Aqua's|Team Rocket's|Misty's|Brock's|Giovanni's|Galarian|Paldean|Alolan|Team Plasma's)\s+/i, '');
            // Remove common suffixes
            name = name.replace(/\s(EX|GX|VMAX|VSTAR|Tag Team|Lv\.X|BREAK|Prime|FB|G|GL|4|V-UNION|V)$/i, '');
            // Normalize spaces and capitalization
            return name.trim().toLowerCase();
        }

        document.getElementById("searchBtn").onclick = async () => {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;

            const cards = await searchCards(query);
            if (cards.length === 0) {
                alert("No cards found!");
                return;
            }

            renderCards(cards);
        };

        function evaluateCard(card) {
            // Example evaluation function (same as before)
            return { score: Math.floor(Math.random() * 10), tier: "A" };
        }

        function determineCardType(card) {
            // Example card type determination (same as before)
            return "210";
        }
    </script>
</body>
</html>
